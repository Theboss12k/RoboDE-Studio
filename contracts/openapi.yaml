openapi: 3.1.0
info:
  title: RoboDE Studio API
  version: 1.0.0
  summary: Design a rough robot from a task, then find and check real robots that can do the job.
  description: |
    The HTTP API of RoboDE Studio. Everything the web app does goes through these routes, so another application can
    drive every feature: brief, reference files, question rounds (with comments, notes and answer images), design,
    versions and assets, revise (base version, moment, auto repair), approve, fleet, catalog search, datasheet
    analysis, decision, export, jobs, and LLM settings and usage.

    This file is the authoritative spec for every `/api/v1` route. Java tests check that each route has an entry here,
    and that every JSON response of the flow tests validates against its schema. Domain types (`DesignVersion`,
    `Candidate`, `Analysis`, ...) are the generated JSON Schemas in `contracts/schemas/`; their single source is the
    pydantic models in `server/studio/schemas.py`. `contracts/openapi.bundled.json` is this file with every reference
    resolved; the server serves it at `GET /api/v1/openapi.json`, and other languages can generate an SDK from it.

    ## Units and frames
    - SI units: metres, kilograms, seconds, newtons, newton-metres, watt-hours. Angles are radians in data (joint
      values in frames, `BasePose.yaw`) and degrees only where a field name says so (for example `j1_max_deg`).
    - World frame: z up, origin on the floor, x and y in metres. A family works in its base frame (origin at the
      mounting point, x axis along `BasePose.yaw`).
    - GLB assets and the three.js client are y up (a rotation of -90 degrees about X from the world frame).
    - Timestamps are UTC ISO 8601 strings. `t` in a revise request is seconds into a version's simulation.

    ## Jobs
    Design, revise, fleet design, search, analysis and the LLM profile test are jobs. The start call returns a job
    record (status `running`) and the result is read from `GET /jobs/{id}`. Instead of polling, pass `wait=<seconds>`
    to the start call or to `GET /jobs/{id}`: if the job ends in time the answer is 200 with the final record,
    otherwise 202 with the running record and a `Location` header. `expand=resource` adds the result as a full
    resource (for example the new design version). `X-Studio-Callback: <url>` registers a signed POST to your app when
    the job ends. `DELETE /jobs/{id}` cancels a running job (status `cancelled`, `error_code` `cancelled`). A project runs one design,
    revise or fleet design job at a time (409 otherwise), and one studio build at a time. Starting a search, or an analysis of the same candidate,
    while one is running returns the running job.

    ## Idempotency
    `POST /projects` and every job-starting POST accept `Idempotency-Key` (1 to 200 characters). Keys are kept in
    memory for 24 hours, per key, method and path. The same key with the same body replays the stored response as it was (status,
    body and headers: same project, same job id; a stored 202 replays as 202); responses of 500 and above are not
    stored; the same key with a different body, or an empty or over-long key, is a 422. The key check reads at most 4 MB of
    body (413 above that). A server restart forgets all keys.

    ## Errors
    Every error body is `{"detail": string, "error_code"?: string}`. Status codes: 401 (token missing or wrong),
    404 (unknown project, version, candidate, job or route), 409 (state conflict: project busy, approved design is
    frozen), 413 (upload above 64 MB), 422 (invalid input), 502 (the language model failed) and 500. A job that fails
    keeps the HTTP status 200 and reports `status: "error"` with `error` and `error_code` (for example
    `datasheet_download`) in its record.

    ## Authentication
    The server binds to 127.0.0.1 by default, and loopback callers need no credentials. With `STUDIO_TOKEN` set
    (required for any other bind address), every `/api/v1` call needs `Authorization: Bearer <token>`. The scheme is
    therefore declared optional (`security: [{}, {bearerAuth: []}]`): none on an open loopback server, bearer
    otherwise.

    ## Versioning policy
    `/api/v1` is additive only: new routes, new optional request fields and new response fields may appear, but no
    route, field or enum value is removed or changes meaning. A client must ignore response fields it does not
    know. Breaking changes go to `/api/v2`.

    ## Limits
    A project brief is 1 to 8000 characters. Uploads are at most 64 MB. At most 8 reference plus answer images go to
    the model per design round. The server runs at most 4 task processes at once.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8800/api/v1
    description: Local Studio server (default bind address and port)
security:
  - {}
  - bearerAuth: []
tags:
  - name: Projects
    description: Create, read and delete projects; the reference (text, photos, URDF).
  - name: Questions & design
    description: Question rounds with answers, comments, notes and images; the design job.
  - name: Versions
    description: Design versions, their assets, and approval.
  - name: Revise
    description: Change a version by a request at a moment of its simulation.
  - name: Fleet
    description: Multi-robot planning for the approved or latest version.
  - name: Catalog
    description: Search real robots, analyse their datasheets.
  - name: Decision & export
    description: Record the decision and export the design.
  - name: Studio
    description: Robot studio for an approved design. Builds (CAD, motors, electronics), the digital twin, snapshots and the manufacturer package.
  - name: AR
    description: Photo AR (design drawn over a photo of the site) and the phone link.
  - name: Site scan
    description: Site videos reconstructed in 3D, and the scene edits made inside them.
  - name: Ask
    description: The Ask bar. Questions answered from stored project data, and at most two actions the server performs for the user.
  - name: Jobs
    description: Read, list and cancel background jobs.
  - name: LLM settings
    description: Global model profiles, role assignment, API keys and token usage.
  - name: Settings
    description: Global settings that are not LLM settings, such as preferred vendors.
  - name: Meta
    description: Health, robot families and this specification.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Meta]
      summary: Health check
      description: Returns `ok` and the profile id used by each LLM role.
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example:
                ok: true
                llm: { spec: gemini_pro, scene: gemini_flash, robot: gemini_pro, revise: gemini_pro, search: gemini_flash, extract: gemini_flash, analysis: gemini_pro, objects: gemini_flash_lite, ask: gemini_flash, checks: gemini_pro }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /families:
    get:
      operationId: listFamilies
      tags: [Meta]
      summary: Robot families
      description: The robot families the designer can use, with the JSON Schema of each family's parameters.
      responses:
        '200':
          description: The families.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Family' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /openapi.json:
    get:
      operationId: getOpenApiSpec
      tags: [Meta]
      summary: This specification
      description: The bundled OpenAPI document (`contracts/openapi.bundled.json`), with every `$ref` resolved.
      responses:
        '200':
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects
      description: Newest update first.
      responses:
        '200':
          description: Project summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectSummary' }
              example:
                - { id: p_ab12cd34ef, title: Move a 0.3 kg bottle from A to B, stage: brief, created: '2026-11-20T09:00:00Z', updated: '2026-11-20T09:00:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project from a brief
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
            example: { brief: Move a 0.3 kg bottle from A to B }
      responses:
        '200':
          description: The new project (stage `brief`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
              example:
                id: p_ab12cd34ef
                title: Move a 0.3 kg bottle from A to B
                brief: Move a 0.3 kg bottle from A to B
                reference: null
                stage: brief
                questions: []
                answers: {}
                versions: []
                approved_version: null
                candidates_count: 0
                selected_candidate: null
                analyses: []
                decision: null
                created: '2026-11-20T09:00:00Z'
                updated: '2026-11-20T09:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /projects/{pid}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      summary: Read a project
      description: The project view. `stage` is one of brief, questions, designed, approved, candidates, analysed, decided.
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete a project and everything in it
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
              example: { ok: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{pid}/reference:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: putReference
      tags: [Projects]
      summary: Set the reference text
      description: Replaces the reference text. An empty string removes it. Photos and the URDF are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferenceTextRequest' }
            example: { text: A bench-top task. }
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: clearReference
      tags: [Projects]
      summary: Remove the whole reference (text, photos, URDF)
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{pid}/brief:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: updateBrief
      tags: [Projects]
      summary: Edit the brief
      description: |
        Replaces the brief (10 to 20000 characters after trimming). Pending questions are cleared and `round` resets to
        0, so the next design call starts the question rounds again with the new brief. Earlier answers, comments and
        notes are kept; existing versions are untouched. `brief_updated` is set. 409 when a version is approved
        or while a design or revise job runs for the project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBriefRequest' }
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{pid}/brief/files:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: uploadBriefImage
      tags: [Projects]
      summary: Attach a photo to the brief
      description: |
        Raw image bytes (PNG, JPEG or WebP): a photo of the task, the objects or the workcell (not the reference robot).
        Brief, reference and answer images together are at most 8 (422 beyond). Not allowed after a version is approved (409).
        The images go to the model with the next design call.
      parameters:
        - $ref: '#/components/parameters/Filename'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: All brief images of the project.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BriefImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{pid}/brief/files/{name}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: name
        in: path
        required: true
        description: The stored file name from `brief_images[].name`.
        schema: { type: string }
    get:
      operationId: getBriefImage
      tags: [Projects]
      summary: Download a brief image
      responses:
        '200':
          description: The image bytes with their detected media type.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteBriefImage
      tags: [Projects]
      summary: Remove a brief image
      description: Not allowed after a version is approved (409).
      responses:
        '200':
          description: The remaining brief images.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BriefImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{pid}/reference/files:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: uploadReferenceFile
      tags: [Projects]
      summary: Upload a reference photo or URDF
      description: |
        Raw file bytes as the body. PNG, JPEG or WebP photos (at most 6 per project, and 8 images in all with brief and
        answer images) or a `.urdf` / `.zip` robot description (replaces the previous one). The file is inspected before it is stored.
      parameters:
        - $ref: '#/components/parameters/Filename'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{pid}/design:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: startDesign
      tags: [Questions & design]
      summary: Run the next design step (question round or design)
      description: |
        Starts a design job. The AI either returns the next round of questions (`result.status: questions`) or, when
        it has enough answers, the first design version (`result.status: designed`, `result.version`). Send the answers
        given so far (new answers are merged into the project's answers), optional comments per question, one general
        note per round, and images attached with `uploadAnswerImage`.
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignRequest' }
            examples:
              firstRound: { summary: 'First call, no answers yet', value: { answers: {} } }
              answered: { summary: 'Answers to the first round', value: { answers: { cycle: 6 } } }
      responses:
        '200':
          description: The job record (running, or finished when `wait` was used and the job ended in time).
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: 4f1c9a2b7d3e
                kind: design
                robot_id: p_ab12cd34ef
                status: running
                progress: []
                result: null
                error: null
                error_code: null
                started: '2026-11-20T09:00:05Z'
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /projects/{pid}/answers/files:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: uploadAnswerImage
      tags: [Questions & design]
      summary: Attach an image to a question
      description: |
        Raw image bytes (PNG, JPEG or WebP). `question` is a question id of the current round or `_general` for the
        round's note. Images are sent to the model with the next design call.
      parameters:
        - $ref: '#/components/parameters/Filename'
        - name: question
          in: query
          required: true
          description: A question id, or `_general`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: All answer images of the project.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnswerImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{pid}/answers/files/{name}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: name
        in: path
        required: true
        description: The stored file name from `answer_images[].name`.
        schema: { type: string }
    get:
      operationId: getAnswerImage
      tags: [Questions & design]
      summary: Download an answer image
      responses:
        '200':
          description: The image bytes with their detected media type.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/bmp: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAnswerImage
      tags: [Questions & design]
      summary: Remove an answer image
      responses:
        '200':
          description: The remaining answer images.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AnswerImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{pid}/versions/{n}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/VersionNumber'
    get:
      operationId: getVersion
      tags: [Versions]
      summary: Read a design version
      description: The stored version (spec, requirements, scene, robot, URDF, simulation with frames and checks) plus the parsed URDF.
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignVersionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/versions/{n}/assets/{asset}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/VersionNumber'
      - name: asset
        in: path
        required: true
        schema: { type: string, enum: [design.urdf, design.glb, frames.json] }
    get:
      operationId: getVersionAsset
      tags: [Versions]
      summary: Download a version asset
      description: '`design.urdf` (the robot, XML), `design.glb` (zero-pose mesh, glTF binary, y up) or `frames.json` (the simulated frames).'
      responses:
        '200':
          description: The asset.
          content:
            application/xml: { schema: { type: string } }
            model/gltf-binary: { schema: { type: string, format: binary } }
            application/json:
              schema:
                type: array
                items: { $ref: './schemas/Frame.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: approveVersion
      tags: [Versions]
      summary: Approve (freeze) a version
      description: Freezes the design. Approving the approved version again is a no-op; approving another version is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
            example: { version: 2 }
      responses:
        '200':
          description: The updated project (stage `approved`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{pid}/revise:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: reviseDesign
      tags: [Revise]
      summary: Change a design by a request
      description: |
        Starts a revise job that creates a new version from `base_version` (default: the latest). `t` is the moment
        of the base version's simulation the request refers to, in seconds (0 up to its duration). The result is
        `{version: n}`. A project with an approved version is frozen (409).
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviseRequest' }
            example: { request: make it reach 20 cm further, base_version: 1, t: 2.5 }
      responses:
        '200':
          description: The job record.
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: 8a0b6c1d2e3f
                kind: revise
                robot_id: p_ab12cd34ef
                status: running
                progress: []
                result: null
                error: null
                error_code: null
                started: '2026-11-20T09:05:00Z'
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }

  /projects/{pid}/baseline:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: putBaseline
      tags: [Projects]
      summary: Set the time-saved inputs
      description: >-
        Stores the manual baseline and the working pattern used by the time-saved estimate (any subset of the fields; `null`
        removes `manual_cycle_s` or `operators`, or restores another field's default). Stored values override `spec.baseline`
        and the defaults. Allowed while a design or revise job runs. The estimate itself is computed from these inputs and the
        robot's simulated cycle (`savings` in `@robode/studio-core`); it is not a time study.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BaselineUpdate' }
            example: { manual_cycle_s: 12, operators: 2, days_per_week: 6 }
      responses:
        '200':
          description: The updated project (with `savings_inputs`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{pid}/fleet:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    put:
      operationId: putFleet
      tags: [Fleet]
      summary: Set fleet options
      description: Turn the fleet on or off, set its limits (`null` clears them) and choose the member used for robot search. Send at least one field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetUpdate' }
            example: { enabled: true, limits: { max_robots: 2 } }
      responses:
        '200':
          description: The updated project (with `fleet`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{pid}/fleet/assign:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: assignFleet
      tags: [Fleet]
      summary: Preview and store a robot assignment
      description: |
        Runs immediately (no AI, no job). With no `assignment` the code proposes one; with an `assignment` it is
        validated and stored as the user's confirmed assignment. The base version defaults to the approved version,
        else the latest.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetAssignRequest' }
      responses:
        '200':
          description: The assignment, a preview of the layout, and whether it is feasible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetAssignResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{pid}/fleet/design:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: startFleetDesign
      tags: [Fleet]
      summary: Plan the fleet as a new version
      description: 'Starts a fleet_design job on the base version (default: the latest) using the stored assignment. 409 when no assignment was stored or the design is approved.'
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetDesignRequest' }
      responses:
        '200':
          description: 'The job record. The result is `{version: n}`.'
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }

  /projects/{pid}/search:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: startSearch
      tags: [Catalog]
      summary: Search for real robots that fit the approved design
      description: 'Starts a search job (the design must be approved, otherwise the job ends with an error). While a search of the project is running the same job record is returned. The result is `{candidates: [...]}`.'
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      responses:
        '200':
          description: The job record.
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: 2c5d7e9f1a3b
                kind: search
                robot_id: p_ab12cd34ef
                status: running
                progress: []
                result: null
                error: null
                error_code: null
                started: '2026-11-20T09:10:00Z'
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /projects/{pid}/candidates:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listCandidates
      tags: [Catalog]
      summary: List the candidates found by the last search
      responses:
        '200':
          description: The candidates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: './schemas/Candidate.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{pid}/candidates/{cid}/analyse:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      operationId: startAnalysis
      tags: [Catalog]
      summary: Analyse a candidate against its datasheet
      description: |
        Starts an analyse job. The datasheet comes from, in order: `datasheet_url` (https only), a datasheet uploaded
        with `uploadDatasheet`, the candidate's own datasheet link, its product page. Quotes are verified against the
        document text. The same candidate being analysed returns the running job. The result is the analysis view
        (`GET /projects/{pid}/analysis/{cid}`). A failed download ends the job with `error_code: datasheet_download`.
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyseRequest' }
            example: { datasheet_url: 'https://acme.example/ra6.pdf' }
      responses:
        '200':
          description: The job record.
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: 9e8d7c6b5a40
                kind: analyse
                robot_id: p_ab12cd34ef
                status: running
                progress: []
                result: null
                error: null
                error_code: null
                started: '2026-11-20T09:12:00Z'
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /projects/{pid}/candidates/{cid}/datasheet:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CandidateId'
    post:
      operationId: uploadDatasheet
      tags: [Catalog]
      summary: Upload a datasheet for a candidate
      description: Raw bytes of a PDF, HTML or text file. It is used by the next analysis of this candidate that has no `datasheet_url`.
      parameters:
        - $ref: '#/components/parameters/Filename'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasheetUploaded' }
              example: { ok: true, characters: 424 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{pid}/analysis/{cid}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CandidateId'
    get:
      operationId: getAnalysis
      tags: [Catalog]
      summary: Read the analysis of a candidate
      responses:
        '200':
          description: The analysis with the parsed URDF of the candidate's robot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{pid}/decision:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: setDecision
      tags: [Decision & export]
      summary: Record the decision
      description: 'Either choose an analysed catalog candidate, or choose your own design (the approved Robot studio build). Choosing again overwrites the decision. `self` returns 409 when no build is approved (or the given build is not approved) and 404 for an unknown build.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
            examples:
              candidate: { summary: Buy an analysed catalog robot, value: { candidate_id: acme_ra_6, action: approve } }
              self: { summary: Build our own design (the approved Robot studio build), value: { action: self } }
      responses:
        '200':
          description: The updated project (stage `decided`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /projects/{pid}/export:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: exportProject
      tags: [Decision & export]
      summary: Export the design as a zip
      description: The approved version (else the latest) with spec, requirements, scene, simulation summary, URDF, GLB, every analysis and the decision, and a README of the limits.
      responses:
        '200':
          description: The archive.
          headers:
            Content-Disposition:
              description: '`attachment; filename="..."`.'
              schema: { type: string }
          content:
            application/zip: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /projects/{pid}/studio/builds:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: startStudioBuild
      tags: [Studio]
      summary: Build the robot (CAD, motors, electronics)
      description: |
        Starts a `studio_build` job for the approved design version. `design_version` defaults to the approved one and
        must be it (409 otherwise, and 409 while no version is approved). `base_build` starts from an earlier build;
        with only `pinned` changed (`{joint: alternative_id}`) the shop search is not repeated. `request` is a change
        in words. Only one studio build runs per project at a time (409). The result is `{build: n}`; with
        `expand=resource` the job carries the build view. Sizing and CAD checks are kinematic and static calculations,
        not dynamics and not hardware tests; prices are dated web estimates.
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudioBuildRequest' }
            example: { request: use a stronger shoulder motor, base_build: 1, pinned: { j1: robu_nema23 } }
      responses:
        '200':
          description: The job record (running, or finished when `wait` was used and the job ended in time).
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listStudioBuilds
      tags: [Studio]
      summary: List the builds of a project
      responses:
        '200':
          description: One row per build, ascending.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudioBuildSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/studio/builds/{n}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BuildNumber'
    get:
      operationId: getStudioBuild
      tags: [Studio]
      summary: Read a build
      description: The stored build (sizing, motors, electronics, style, parts, URDF, twin limits, checks, files) plus the parsed studio URDF.
      responses:
        '200':
          description: The build.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioBuildView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/studio/builds/{n}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BuildNumber'
      - name: path
        in: path
        required: true
        description: A relative path inside the build folder, for example `assembly.step` or `parts/p1.stl`. Paths that leave the folder are a 422.
        schema: { type: string }
        allowReserved: true
    get:
      operationId: getStudioBuildFile
      tags: [Studio]
      summary: Download a file of a build
      description: STEP is `model/step`, STL `model/stl`, URDF `application/xml`; also PNG, PDF, ZIP, CSV and JSON.
      responses:
        '200':
          description: The file.
          content:
            model/step: { schema: { type: string, format: binary } }
            model/stl: { schema: { type: string, format: binary } }
            application/xml: { schema: { type: string } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string } }
            application/json: { schema: { type: object, additionalProperties: true } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/studio/builds/{n}/twin/move:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BuildNumber'
    post:
      operationId: studioTwinMove
      tags: [Studio]
      summary: Move the digital twin to a target
      description: |
        Runs the twin synchronously (no model): from `q0` to joint values or a cartesian point under the build's joint,
        speed, acceleration and torque limits. The result lists the frames and every limit that bound. This is a
        kinematic and limit model, not a dynamics simulation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/TwinMoveRequest.json' }
      responses:
        '200':
          description: The motion.
          content:
            application/json:
              schema: { $ref: './schemas/TwinMoveResult.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/studio/builds/{n}/twin/run:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BuildNumber'
    post:
      operationId: studioTwinRun
      tags: [Studio]
      summary: Replay the design's task on the twin
      description: Replays the design's waypoints under the build's limits (synchronous, no model).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TwinRunRequest' }
      responses:
        '200':
          description: The motion.
          content:
            application/json:
              schema: { $ref: './schemas/TwinMoveResult.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/studio/builds/{n}/snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BuildNumber'
      - name: view
        in: query
        required: true
        schema: { type: string, enum: [iso, front, side, top] }
    post:
      operationId: uploadStudioSnapshot
      tags: [Studio]
      summary: Store a render of the twin
      description: The raw PNG body (at most 15 MB) is stored for the manufacturer PDF. A build that is approved is frozen (409). A body that is not a PNG is a 422.
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: The views stored for this build.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioViews' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/studio/builds/{n}/approve:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BuildNumber'
    post:
      operationId: approveStudioBuild
      tags: [Studio]
      summary: Approve a build and make the manufacturer package
      description: >-
        Starts a `studio_pdf` job (no model) that writes `manufacturer.pdf`, `package.zip` and `bom.csv`, then marks the build approved. The result is `{build: n}`. An approved build is a 409.
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      responses:
        '200':
          description: The job record.
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/studio/builds/{n}/pdf:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BuildNumber'
    get:
      operationId: getStudioPdf
      tags: [Studio]
      summary: Download the manufacturer PDF
      description: Available once the build is approved; 404 before.
      responses:
        '200':
          description: The PDF.
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /projects/{pid}/studio/builds/{n}/package:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/BuildNumber'
    get:
      operationId: getStudioPackage
      tags: [Studio]
      summary: Download the manufacturer package
      description: A ZIP with the PDF, assembly STEP, parts, URDF and BOM CSV. Available once the build is approved; 404 before.
      responses:
        '200':
          description: The archive.
          headers:
            Content-Disposition:
              description: '`attachment; filename="package.zip"`.'
              schema: { type: string }
          content:
            application/zip: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /projects/{pid}/ar/scenes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: uploadArScene
      tags: [AR]
      summary: Add a photo of the site (photo AR)
      description: Raw image bytes (PNG, JPEG or WebP, at most 64 MB). At most 10 AR scenes per project (422 beyond). See docs/AR_PHOTO.md.
      parameters:
        - $ref: '#/components/parameters/Filename'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: The new AR scene.
          content:
            application/json:
                schema: { $ref: './schemas/ArScene.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      operationId: listArScenes
      tags: [AR]
      summary: List the AR scenes of a project
      description: Newest first.
      responses:
        '200':
          description: The scenes.
          content:
            application/json:
                schema:
                  type: array
                  items: { $ref: './schemas/ArScene.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{pid}/ar/scenes/{sid}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: sid
        in: path
        required: true
        description: Scene or scan id.
        schema: { type: string }
    get:
      operationId: getArScene
      tags: [AR]
      summary: Read one AR scene
      responses:
        '200':
          description: The scene.
          content:
            application/json:
                schema: { $ref: './schemas/ArScene.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteArScene
      tags: [AR]
      summary: Delete an AR scene
      description: Removes the photo and the scene.
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{pid}/ar/scenes/{sid}/photo:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: sid
        in: path
        required: true
        description: Scene or scan id.
        schema: { type: string }
    get:
      operationId: getArPhoto
      tags: [AR]
