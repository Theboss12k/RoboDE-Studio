        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /ask:
    post:
      operationId: ask
      tags: [Ask]
      summary: Ask a question about the project on screen
      description: >-
        Starts an `ask` job (role `ask`). The server builds the facts to answer from for the ids in `context` (project,
        version, build, candidate, the moment `t`) from stored data: numbers are never taken from the client. The model
        answers from those facts and may propose at most two actions of a fixed list (`revise`, `design`, `search`,
        `analyse`, `studio_build`, `update_brief`, `set_baseline`, `cancel_job`). The server validates each proposal exactly as
        the matching route validates its body, executes it (a job it starts appears in the project's job list and can be
        cancelled) and reports it in `actions_taken`; a refused one has `ok: false` and an `error` (`not allowed` for
        anything else, such as delete, keys, settings, profiles, approve or decision; `limit: 2 actions per question` for
        extras). An approval, a build approval or a decision is never executed: it comes back in `confirm` as a chip whose
        `request` is the body of the existing route (`approve_build` also carries `build`, which goes into the path). Each
        action is logged in the project's activity. `navigate` only tells the client where to look. 404 when a referenced
        project, version, build or candidate does not exist; 422 for an invalid body.
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/AskRequest.json' }
            example: { question: 'Why does the reach check pass?', history: [], context: { project_id: p_0123456789, stage: design, version: 2 } }
      responses:
        '200':
          description: The job record; `result` is an `AskResponse` once `status` is `done`.
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /jobs:
    get:
      operationId: listRunningJobs
      tags: [Jobs]
      summary: Running jobs of all projects
      description: Always lists the running jobs of every project, oldest first; there are no filter parameters.
      responses:
        '200':
          description: Running jobs, oldest first, with `subject` and `finished`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Read a job
      description: |
        Jobs are kept in memory (the last finished ones), so a job id is unknown after a server restart. With
        `wait`, the call returns as soon as the job ends (200) or after the wait with the running record (202).
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
      responses:
        '200':
          description: The job record (running, done, error or cancelled).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              examples:
                questions:
                  summary: A finished design job that asked questions
                  value:
                    id: 4f1c9a2b7d3e
                    kind: design
                    robot_id: p_ab12cd34ef
                    status: done
                    progress: [Reading your brief]
                    result:
                      status: questions
                      questions:
                        - { id: cycle, text: Cycle time?, kind: number, options: [], unit: s, default: 6, why: '' }
                    error: null
                    error_code: null
                    started: '2026-11-20T09:00:05Z'
                designed:
                  summary: A finished design job that produced version 1
                  value:
                    id: 5a6b7c8d9e0f
                    kind: design
                    robot_id: p_ab12cd34ef
                    status: done
                    progress: [Updating the specification (round 2), Working out the requirements, 'Task simulated: 16 of 19 checks pass']
                    result: { status: designed, version: 1 }
                    error: null
                    error_code: null
                    started: '2026-11-20T09:01:00Z'
                revised:
                  summary: A finished revise job
                  value:
                    id: 8a0b6c1d2e3f
                    kind: revise
                    robot_id: p_ab12cd34ef
                    status: done
                    progress: [Working out what the change touches, 'Task simulated: 16 of 19 checks pass']
                    result: { version: 2 }
                    error: null
                    error_code: null
                    started: '2026-11-20T09:05:00Z'
                failed:
                  summary: A failed analyse job
                  value:
                    id: 1b2c3d4e5f60
                    kind: analyse
                    robot_id: p_ab12cd34ef
                    status: error
                    progress: [Downloading the datasheet]
                    result: null
                    error: 'Datasheet download failed: Only https:// URLs are allowed. Upload the datasheet (PDF or text) instead.'
                    error_code: datasheet_download
                    started: '2026-11-20T09:12:00Z'
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: cancelJob
      tags: [Jobs]
      summary: Cancel a running job
      description: |
        Kills the job's task process tree. The record becomes `status: cancelled` with `error` "Cancelled by the caller" and `error_code` `cancelled`. The call waits up to 10 seconds for the processes to stop. If a task finishes at the very moment of the cancel it may already have committed, and the record still says cancelled.
        Model usage already streamed is kept; nothing is committed to the project from a cancelled job; the project
        lock is released. A job that already ended is a 409.
      responses:
        '200':
          description: The cancelled job record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{pid}/jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectJobs
      tags: [Jobs]
      summary: Jobs of a project
      description: Running jobs first (oldest first), then finished ones (newest first), at most 20, with `subject` and `finished`.
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

