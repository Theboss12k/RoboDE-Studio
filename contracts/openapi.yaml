        content:
          application/json:
            schema: { type: object, required: [scene], properties: { base_version: { type: [integer, 'null'] }, scene: { $ref: './schemas/SceneSpec.json' }, markers: { type: array, items: { type: object, additionalProperties: true } }, auto_repair: { type: [boolean, 'null'] }, note: { type: [string, 'null'], maxLength: 4000 } } }
      responses:
