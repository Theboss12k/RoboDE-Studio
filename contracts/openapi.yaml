              schema: { $ref: '#/components/schemas/LlmProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteLlmProfile
      tags: [LLM settings]
      summary: Delete a profile
      description: A profile that a role uses cannot be deleted (422).
      responses:
        '200':
          description: The settings after the deletion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /llm/profiles/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      operationId: testLlmProfile
      tags: [LLM settings]
      summary: Test a profile with a small request
      description: Starts an `llm_test` job. Its result is `{ok, answer, seconds}`.
      parameters:
        - $ref: '#/components/parameters/Wait'
        - $ref: '#/components/parameters/Expand'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Callback'
      responses:
        '200':
          description: The job record.
          headers:
            Location: { $ref: '#/components/headers/JobLocation' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '202': { $ref: '#/components/responses/JobRunning' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }
  /llm/roles:
    put:
      operationId: setLlmRoles
      tags: [LLM settings]
      summary: Assign profiles to roles
      description: Planner and converter style roles (`spec`, `scene`, `robot`, `revise`, `search`, `extract`, `analysis`) can use different profiles. Roles not in the body keep their profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRolesRequest' }
            example: { roles: { analysis: gemini_flash } }
      responses:
        '200':
          description: The profile id of every role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roles' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /llm/keys/{provider}:
    parameters:
      - $ref: '#/components/parameters/Provider'
    put:
      operationId: saveLlmKey
      tags: [LLM settings]
      summary: Save an API key
      description: The key is stored on the server and never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveKeyRequest' }
      responses:
        '200':
          description: Key status of every provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      operationId: deleteLlmKey
      tags: [LLM settings]
      summary: Delete a saved API key
      responses:
        '200':
          description: Key status of every provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /llm/usage:
    get:
      operationId: getLlmUsage
      tags: [LLM settings]
      summary: Token and cost usage
      parameters:
        - $ref: '#/components/parameters/UsagePeriod'
      responses:
        '200':
          description: The usage summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /usage:
    get:
      operationId: getUsage
      tags: [LLM settings]
      summary: Token and cost usage (alias of /llm/usage)
      parameters:
        - $ref: '#/components/parameters/UsagePeriod'
      responses:
        '200':
          description: The usage summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /llm/usage/reset:
    post:
      operationId: resetLlmUsage
      tags: [LLM settings]
      summary: Start a new usage ledger
      description: The old ledger is kept on the server beside the new one.
      responses:
        '200':
          description: The (empty) summary for period `all`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /settings/vendors:
    get:
      operationId: getPreferredVendors
      tags: [Settings]
      summary: Read the preferred vendors
      description: The shops the user wants searched first for robots, motors and electronics. A global setting, not part of a project.
      responses:
        '200':
          description: The saved vendors (an empty list when none were saved).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferredVendors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: setPreferredVendors
      tags: [Settings]
      summary: Replace the preferred vendors
      description: |
        Replaces the whole list (at most 50). Each domain is a bare host such as `robu.in` (lower case, no scheme or path);
        domains must be unique. Catalog searches and studio builds started afterwards use the new list.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferredVendors' }
            example: { vendors: [{ name: Robu, domain: robu.in, categories: [motors, electronics], note: India } ] }
      responses:
        '200':
          description: The saved list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferredVendors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '413': { $ref: '#/components/responses/TooLarge' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Required only when the server runs with `STUDIO_TOKEN` (always for a non-loopback bind). Loopback callers of an
        unprotected server send nothing. A wrong or missing token is a 401 with `WWW-Authenticate: Bearer`.

  parameters:
    ProjectId:
      name: pid
      in: path
      required: true
      description: Project id, as returned by `createProject` (`p_` and 10 hex characters).
      schema: { type: string }
    VersionNumber:
      name: n
      in: path
      required: true
      description: Version number, from 1.
      schema: { type: integer, minimum: 1 }
    BuildNumber:
      name: n
      in: path
      required: true
      description: Studio build number, from 1.
      schema: { type: integer, minimum: 1 }
    CandidateId:
      name: cid
      in: path
      required: true
      description: Candidate id from the search result.
      schema: { type: string }
    JobId:
      name: id
      in: path
      required: true
      description: Job id.
      schema: { type: string }
    ProfileId:
      name: id
      in: path
      required: true
      description: LLM profile id.
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      description: A provider kind that needs a key, for example `gemini`.
      schema: { type: string }
    Filename:
      name: filename
      in: query
      required: true
      description: Name of the uploaded file. Its extension tells the type (for example `photo.png`, `robot.urdf`, `ra6.pdf`).
      schema: { type: string }
    UsagePeriod:
      name: period
      in: query
      description: Period to summarise.
      schema: { type: string, enum: [today, 7d, 30d, all], default: 7d }
    Wait:
      name: wait
      in: query
      description: |
        Whole seconds to wait for the job to end (0 to 600; outside that range is a 422). 0 returns at once. If the job ends within the wait the answer
        is 200 with the final record, otherwise 202 with the running record.
      schema: { type: integer, minimum: 0, maximum: 600, default: 0 }
    Expand:
      name: expand
      in: query
      description: '`resource` (the only value; others are a 422) adds the job''s result as a full resource in `resource` once the job is finished (see `Job.resource`).'
      schema: { type: string, enum: [resource] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        1 to 200 characters. The same key with the same body replays the first response; with a different body it is a
        422 (as is an empty or longer key). A replay returns the stored status, body and headers; 500 and above are not stored. Kept in
        memory for 24 hours per key, method and path.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Callback:
      name: X-Studio-Callback
      in: header
      description: |
        http(s) URL that receives the final job record (expanded) as a POST when the job ends (done, error or
        cancelled), with `X-Studio-Job`, `X-Studio-Event: job.finished` and, when `STUDIO_CALLBACK_SECRET` is set,
        `X-Studio-Signature: sha256=<hex HMAC of the body>`. Up to four attempts (at once, then after 1, 5 and 25 seconds; `callback.attempts` counts them all); a failed
        delivery never changes the job. A search or analysis that joins a running job keeps the first callback URL. The host must be in `STUDIO_CALLBACK_HOSTS` (default `localhost,127.0.0.1,::1`),
        otherwise the start is a 422.
      schema: { type: string, format: uri }

  headers:
    JobLocation:
      description: Relative URL of the job, `/api/v1/jobs/{id}`.
      schema: { type: string }

  responses:
    JobRunning:
      description: The job did not end within `wait`. The running record; poll `Location` or wait again.
      headers:
        Location: { $ref: '#/components/headers/JobLocation' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Job' }
    Unauthorized:
      description: The server needs a bearer token and none, or a wrong one, was sent.
      headers:
        WWW-Authenticate: { schema: { type: string, const: Bearer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: A valid bearer token is required }
    NotFound:
      description: Unknown project, version, candidate, job, profile or file.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: Project not found }
    Conflict:
      description: State conflict, for example the project is busy with another design step, the approved design is frozen, or the job already ended.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: This project is still working on another design step }
    TooLarge:
      description: The upload is above 64 MB (a multipart size error gives the same body), or the body checked for an Idempotency-Key is above 4 MB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: The input is not acceptable (missing or malformed field, unsafe URL, Idempotency-Key reuse, bad callback host).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: brief must be 1 to 8000 characters }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: Every error body.
      properties:
        detail: { type: string, description: 'Readable message.' }
        error_code: { type: string, description: 'Machine-readable cause when there is one, for example `datasheet_download`.' }
      required: [detail]
    Ok:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    Health:
      type: object
      properties:
        ok: { type: boolean }
        llm: { $ref: '#/components/schemas/Roles' }
      required: [ok, llm]
    Family:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        mobile: { type: boolean }
        params_schema: { type: object, additionalProperties: true, description: 'JSON Schema of the family parameters.' }
      required: [name, title, description, mobile, params_schema]
    ProjectSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: [string, 'null'] }
        stage: { $ref: '#/components/schemas/Stage' }
        created: { type: [string, 'null'], format: date-time }
        updated: { type: [string, 'null'], format: date-time }
      required: [id, title, stage, created, updated]
    Stage:
      type: [string, 'null']
      description: Where the project is. `brief` (created), `questions` (a round awaits answers), `designed`, `approved`, `candidates` (search done), `analysed`, `decided`.
      enum: [brief, questions, designed, approved, candidates, analysed, decided, null]
    ReferenceFile:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [image, urdf] }
      required: [name, kind]
    Reference:
      type: [object, 'null']
      description: The reference text and files; null when there is none.
      properties:
        text: { type: string }
        files: { type: array, items: { $ref: '#/components/schemas/ReferenceFile' } }
      required: [text, files]
    BriefImage:
      type: object
      description: A photo attached to the brief (task, objects or workcell).
      properties:
        name: { type: string }
        mime: { type: string }
      required: [name, mime]
    UpdateBriefRequest:
      type: object
      properties:
        brief: { type: string, minLength: 10, maxLength: 20000, description: 'The new brief (10 to 20000 characters after trimming).' }
      required: [brief]
    AnswerImage:
      type: object
      description: An image attached to an answer (a question id, or `_general` for the round's note).
      properties:
        name: { type: string }
        question: { type: string }
        round: { type: integer }
        mime: { type: string }
      required: [name, question]
    FleetState:
      type: object
      description: Present on a project only when a fleet was suggested or the user changed fleet settings.
      properties:
        suggested: { type: boolean }
        enabled: { type: boolean }
        reasons: { type: array, items: { type: string } }
        source: { type: string, description: 'One of spec, code, both, user.' }
        limits: { oneOf: [{ $ref: './schemas/FleetLimits.json' }, { type: 'null' }] }
        assignment: { oneOf: [{ $ref: './schemas/FleetAssignment.json' }, { type: 'null' }] }
        member: { type: [string, 'null'], description: 'The member used for robot search and analysis.' }
    DecisionRecord:
      description: 'The recorded decision: a catalog candidate (`approve`, or the legacy `robot_studio`) or your own design (`self`, with the build number); null before a decision.'
      oneOf:
        - type: 'null'
        - type: object
          properties:
            candidate_id: { type: string }
            action: { type: string, enum: [approve, robot_studio] }
          required: [candidate_id, action]
        - type: object
          properties:
            action: { type: string, enum: [self] }
            build: { type: integer, minimum: 1, description: The approved Robot studio build. }
          required: [action, build]
    Project:
      type: object
      description: The project view.
      properties:
        id: { type: string }
        title: { type: [string, 'null'] }
        brief: { type: [string, 'null'] }
        reference: { $ref: '#/components/schemas/Reference' }
        stage: { $ref: '#/components/schemas/Stage' }
        questions: { type: array, items: { $ref: './schemas/Question.json' }, description: 'The open question round.' }
        answers: { type: object, additionalProperties: true, description: 'Answers so far, by question id.' }
        versions: { type: array, items: { type: integer }, description: 'Version numbers, ascending.' }
        approved_version: { type: [integer, 'null'] }
        fleet: { $ref: '#/components/schemas/FleetState' }
        savings_inputs: { $ref: '#/components/schemas/SavingsInputsState' }
        studio: { $ref: '#/components/schemas/StudioState' }
        answer_comments: { type: object, additionalProperties: { type: string }, description: 'Only when comments exist.' }
        answer_notes:
          type: array
          description: Only when notes exist.
          items:
            type: object
            properties:
              round: { type: integer }
              text: { type: string }
            required: [round, text]
        answer_images: { type: array, items: { $ref: '#/components/schemas/AnswerImage' }, description: 'Only when images exist.' }
        brief_updated: { type: string, format: date-time, description: 'Only once the brief has been edited.' }
        brief_images: { type: array, items: { $ref: '#/components/schemas/BriefImage' }, description: 'Only when images exist.' }
        candidates_count: { type: integer }
        selected_candidate: { type: [string, 'null'] }
        analyses: { type: array, items: { type: string }, description: 'Candidate ids that have an analysis.' }
        decision: { $ref: '#/components/schemas/DecisionRecord' }
        created: { type: [string, 'null'], format: date-time }
        updated: { type: [string, 'null'], format: date-time }
      required: [id, title, brief, reference, stage, questions, answers, versions, approved_version, candidates_count, selected_candidate, analyses, decision, created, updated]
    CreateProjectRequest:
      type: object
      properties:
        brief: { type: string, minLength: 1, maxLength: 8000, description: 'The task in words.' }
      required: [brief]
    ReferenceTextRequest:
      type: object
      properties:
        text: { type: [string, 'null'], maxLength: 60000 }
    DesignRequest:
      type: object
      properties:
        answers: { type: [object, 'null'], additionalProperties: true, description: 'Answers by question id (string, number, boolean or list).' }
        comments:
          type: [object, 'null']
          description: A comment per question id (lower case letters, digits and underscore, at most 41 characters). An empty string removes it.
          additionalProperties: { type: string, maxLength: 1000 }
        note: { type: [string, 'null'], maxLength: 4000, description: 'One general note for the round.' }
        auto_repair: { type: [boolean, 'null'], description: 'Run the automatic collision repair on the new version (default true).' }
    ReviseRequest:
      type: object
      properties:
        request: { type: string, minLength: 1, maxLength: 2000, description: 'The change, in words.' }
        base_version: { type: [integer, 'null'], description: 'Version to change; default the latest.' }
        t: { type: [number, 'null'], minimum: 0, description: 'Moment of the base version''s simulation in seconds (0 to its duration).' }
        auto_repair: { type: [boolean, 'null'] }
      required: [request]
    ApproveRequest:
      type: object
      properties:
        version: { type: integer }
      required: [version]
    SavingsInputsState:
      type: object
      description: Present on a project only once the time-saved inputs were set (`PUT /projects/{pid}/baseline`).
      properties:
        manual_cycle_s: { type: number, exclusiveMinimum: 0, maximum: 86400, description: Seconds one person needs per item by hand. }
        operators: { type: integer, minimum: 1, maximum: 100 }
        hours_per_shift: { type: number, exclusiveMinimum: 0, maximum: 24 }
        days_per_week: { type: number, exclusiveMinimum: 0, maximum: 7 }
        days_per_year: { type: number, exclusiveMinimum: 0, maximum: 366 }
        supervision_min_per_shift: { type: number, minimum: 0, maximum: 1440 }
      required: [hours_per_shift, days_per_week, days_per_year, supervision_min_per_shift]
    BaselineUpdate:
      type: object
      description: Any subset of the fields; send at least one.
      properties:
        manual_cycle_s: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 86400 }
        operators: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        hours_per_shift: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 24 }
        days_per_week: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 7 }
        days_per_year: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 366 }
        supervision_min_per_shift: { type: [number, 'null'], minimum: 0, maximum: 1440 }
    FleetUpdate:
      type: object
      properties:
        enabled: { type: [boolean, 'null'] }
        limits:
          oneOf:
            - $ref: './schemas/FleetLimits.json'
            - { type: 'null' }
          description: max_robots 2 to 3, max_reach_m up to 10, max_payload_kg up to 2000, budget_usd 0 or more.
        member: { type: [string, 'null'], maxLength: 40, description: 'A fleet member id, or null for the default.' }
    FleetAssignRequest:
      type: object
      properties:
        base_version: { type: [integer, 'null'] }
        assignment: { oneOf: [{ $ref: './schemas/FleetAssignment.json' }, { type: 'null' }] }
    FleetDesignRequest:
      type: object
      properties:
        base_version: { type: [integer, 'null'] }
    FleetPreview:
      type: object
      properties:
        bases:
          type: object
          additionalProperties:
            type: object
            properties:
              position: { $ref: '#/components/schemas/Vec3' }
              yaw: { type: number }
        handovers: { type: object, additionalProperties: { $ref: '#/components/schemas/Vec3' } }
        parks:
          type: object
          additionalProperties:
            type: object
            properties:
              start: { $ref: '#/components/schemas/Vec3' }
              end: { $ref: '#/components/schemas/Vec3' }
        workspace_samples: { type: object, additionalProperties: { type: array, items: { $ref: '#/components/schemas/Vec3' } } }
    FleetAssignResult:
      type: object
      properties:
        assignment: { $ref: './schemas/FleetAssignment.json' }
        preview: { $ref: '#/components/schemas/FleetPreview' }
        feasible: { type: boolean }
        notes: { type: array, items: { type: string } }
      required: [assignment, preview, feasible, notes]
    Vec3:
      type: array
      minItems: 3
      maxItems: 3
      items: { type: number }
    AnalyseRequest:
      type: object
      properties:
        datasheet_url: { type: [string, 'null'], maxLength: 800, description: 'https URL of a datasheet (PDF, HTML or text).' }
    DatasheetUploaded:
      type: object
      properties:
        ok: { type: boolean }
        characters: { type: integer, description: 'Characters of text read from the file.' }
      required: [ok, characters]
    DecisionRequest:
      oneOf:
        - type: object
          description: Choose an analysed catalog candidate.
          properties:
            candidate_id: { type: string }
            action: { type: string, enum: [approve, robot_studio] }
          required: [candidate_id, action]
        - type: object
          description: Choose your own design. `build` defaults to the project's approved build.
          properties:
            action: { type: string, enum: [self] }
            build: { type: integer, minimum: 1 }
          required: [action]
    ParsedUrdf:
      type: object
      description: The parsed URDF the server attaches to versions and analyses (not part of the stored model).
      properties:
        name: { type: string }
        base_link: { type: string }
        links: { type: array, items: { type: string } }
        joints:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
              parent: { type: string }
              child: { type: string }
              axis: { type: array, items: { type: number } }
              origin: { $ref: '#/components/schemas/UrdfOrigin' }
              min: { type: [number, 'null'] }
              max: { type: [number, 'null'] }
              velocity: { type: [number, 'null'] }
              effort: { type: [number, 'null'] }
        geometry:
          type: array
          items:
            type: object
            properties:
              link: { type: string }
              kind: { type: string, enum: [visual, collision] }
              shape: { type: string, enum: [box, sphere, cylinder, mesh] }
              parameters: { type: object, additionalProperties: true }
              origin: { $ref: '#/components/schemas/UrdfOrigin' }
        mesh_uris: { type: array, items: { type: string } }
    UrdfOrigin:
      type: object
      properties:
        xyz: { type: array, items: { type: number } }
        rpy: { type: array, items: { type: number } }
    DesignVersionView:
      description: A version as served by the API, the stored model plus its parsed URDF.
      allOf:
        - $ref: './schemas/DesignVersion.json'
        - type: object
          properties:
            parsed: { $ref: '#/components/schemas/ParsedUrdf' }
            fleet_parsed:
              type: object
              description: Parsed URDF per fleet member id; present only when the version has a fleet.
              additionalProperties: { $ref: '#/components/schemas/ParsedUrdf' }
          required: [parsed]
    AnalysisView:
      description: An analysis as served by the API, the stored model plus its parsed URDF.
      allOf:
        - $ref: './schemas/Analysis.json'
        - type: object
          properties:
            parsed: { $ref: '#/components/schemas/ParsedUrdf' }
          required: [parsed]
    QuestionsResult:
      type: object
      description: Result of a design job that needs answers.
      properties:
        status: { type: string, const: questions }
        questions: { type: array, items: { $ref: './schemas/Question.json' } }
      required: [status, questions]
    QuestionsResource:
      type: object
      description: The `resource` of a finished design job that asked questions (the questions and the number of the round).
      properties:
        questions: { type: array, items: { $ref: './schemas/Question.json' } }
        round: { type: integer }
      required: [questions, round]
    DesignedResult:
      type: object
      description: Result of a design job that produced the first version.
      properties:
        status: { type: string, const: designed }
        version: { type: integer }
      required: [status, version]
    VersionResult:
      type: object
      description: Result of a revise or fleet_design job.
      properties:
        version: { type: integer }
      required: [version]
    SearchResult:
      type: object
      properties:
        candidates: { type: array, items: { $ref: './schemas/Candidate.json' } }
      required: [candidates]
    LlmTestResult:
      type: object
      properties:
        ok: { type: boolean }
        answer: { type: string }
        seconds: { type: number }
    JobCallback:
      type: object
      description: Present only when `X-Studio-Callback` was given.
      properties:
        url: { type: string }
        delivered: { type: boolean }
        attempts: { type: integer }
      required: [url, delivered, attempts]
    StudioState:
      type: object
      description: Only when the project has at least one studio build.
      properties:
        builds: { type: array, items: { type: integer }, description: 'Build numbers, ascending.' }
        approved_build: { type: [integer, 'null'] }
      required: [builds, approved_build]
    StudioBuildRequest:
      type: object
      properties:
        design_version: { type: [integer, 'null'], minimum: 1, description: 'Must be the approved version; default: the approved version.' }
        base_build: { type: [integer, 'null'], minimum: 1, description: 'Start from this build (its shop alternatives are reused).' }
        request: { type: [string, 'null'], maxLength: 2000, description: 'A change in words.' }
        pinned:
          type: [object, 'null']
          description: 'Joint name to the alternative id to use for it.'
          additionalProperties: { type: string, minLength: 1, maxLength: 120 }
    StudioBuildSummary:
      type: object
      properties:
        build: { type: integer }
        design_version: { type: integer }
        member: { type: [string, 'null'] }
        parent_build: { type: [integer, 'null'] }
        created: { type: string }
        summary: { type: string }
        approved: { type: boolean }
      required: [build, design_version, member, parent_build, created, summary, approved]
    StudioBuildView:
      description: A build as served by the API, the stored model plus its parsed studio URDF.
      allOf:
        - $ref: './schemas/StudioBuild.json'
        - type: object
          properties:
            parsed: { $ref: '#/components/schemas/ParsedUrdf' }
          required: [parsed]
    StudioBuildResult:
      type: object
      description: Result of a studio_build or studio_pdf job.
      properties:
        build: { type: integer }
      required: [build]
    StudioViews:
      type: object
      properties:
        views: { type: array, items: { type: string, enum: [iso, front, side, top] } }
      required: [views]
    TwinRunRequest:
      type: object
      properties:
        speed_scale: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 2, description: 'Default 1.' }
    Job:
      type: object
      description: A background job's record.
      properties:
        id: { type: string }
        kind: { type: string, enum: [design, revise, fleet_design, search, analyse, llm_test, studio_build, studio_pdf, ask, ar_estimate, scan_reconstruct, apply_scene] }
        robot_id: { type: [string, 'null'], description: 'The project id; null for `llm_test` and for an `ask` without a project.' }
        status: { type: string, enum: [running, done, error, cancelled] }
        progress: { type: array, items: { type: string }, description: 'Progress lines so far.' }
        result:
          description: The job's result when `status` is `done`, otherwise null. The shape depends on `kind`.
          anyOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/QuestionsResult' }
            - { $ref: '#/components/schemas/DesignedResult' }
            - { $ref: '#/components/schemas/VersionResult' }
            - { $ref: '#/components/schemas/SearchResult' }
            - { $ref: '#/components/schemas/AnalysisView' }
            - { $ref: '#/components/schemas/LlmTestResult' }
            - { $ref: '#/components/schemas/StudioBuildResult' }
            - { $ref: './schemas/AskResponse.json' }
        error: { type: [string, 'null'], description: 'The failure message when `status` is `error` or `cancelled`.' }
        error_code: { type: [string, 'null'], description: 'Machine-readable cause, for example `datasheet_download`; `cancelled` for a cancelled job.' }
        started: { type: string, format: date-time }
        subject: { type: [string, 'null'], description: 'Only in job lists. The candidate id of an analysis, `v<n>` of a revise or fleet design, otherwise null.' }
        finished: { type: [string, 'null'], format: date-time, description: 'Only in job lists.' }
        resource:
          description: |
            With `expand=resource` on a finished job: the result as a full resource. A design that produced a version,
            a revise or a fleet_design give the version view (`GET /versions/{n}`); a design with questions gives
            `{questions, round}`; a search gives the candidates; an analysis gives the analysis view; a studio_build or studio_pdf gives the build view (`GET /studio/builds/{n}`).
          anyOf:
            - { $ref: '#/components/schemas/DesignVersionView' }
            - { $ref: '#/components/schemas/QuestionsResource' }
            - { type: array, items: { $ref: './schemas/Candidate.json' } }
            - { $ref: '#/components/schemas/AnalysisView' }
            - { $ref: '#/components/schemas/StudioBuildView' }
        callback: { $ref: '#/components/schemas/JobCallback' }
      required: [id, kind, robot_id, status, progress, result, error, error_code, started]
    Roles:
      type: object
      description: Profile id by role.
      properties:
        spec: { type: string }
        scene: { type: string }
        robot: { type: string }
        revise: { type: string }
        search: { type: string }
        extract: { type: string }
        analysis: { type: string }
      additionalProperties: { type: string }
    LlmProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, description: 'Provider kind, one of `kinds` in the settings.' }
        model: { type: string, maxLength: 120 }
        effort: { type: string, enum: ['', low, medium, high, xhigh, max] }
        timeout_s: { type: integer, minimum: 10, maximum: 900 }
        cli_path: { type: string, maxLength: 1000 }
        location: { type: string, maxLength: 40, description: 'vertex_gemini only: Google Cloud location, global by default.' }
        project: { type: string, maxLength: 100, description: 'vertex_gemini only: Google Cloud project id; empty uses the environment or metadata server.' }
      required: [id, name, kind, model]
    LlmProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, pattern: '^[a-z_]+$', default: gemini }
        model: { type: string, maxLength: 120, default: gemini-3.8-flash }
        effort: { type: string, enum: ['', low, medium, high, xhigh, max], default: '' }
        timeout_s: { type: integer, minimum: 10, maximum: 900, default: 240 }
        cli_path: { type: string, maxLength: 1000, default: '' }
        location: { type: string, maxLength: 40, pattern: '^[a-z0-9-]*$', default: '' }
        project: { type: string, maxLength: 100, pattern: '^[a-z0-9:.-]*$', default: '' }
      required: [name]
    KeyStatus:
      type: object
      description: Key status by provider kind. The key itself is never returned.
      additionalProperties:
        type: object
        properties:
          saved: { type: boolean }
          environment: { type: [string, 'null'], description: 'Name of the environment variable that supplies a key, if any.' }
          ready: { type: boolean }
        required: [saved, ready]
    LlmSettings:
      type: object
      properties:
        profiles: { type: array, items: { $ref: '#/components/schemas/LlmProfile' } }
        roles: { $ref: '#/components/schemas/Roles' }
        kinds: { type: array, items: { type: string } }
        roles_available: { type: array, items: { type: string } }
        keys: { $ref: '#/components/schemas/KeyStatus' }
        models: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 'Model names offered by each kind.' }
      required: [profiles, roles, kinds, roles_available, keys]
    SetRolesRequest:
      type: object
      properties:
        roles: { type: object, additionalProperties: { type: string }, description: 'Role to profile id.' }
      required: [roles]
    SaveKeyRequest:
      type: object
      properties:
        key: { type: string, minLength: 1, maxLength: 400 }
      required: [key]
    PreferredVendor:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        domain: { type: string, minLength: 3, maxLength: 253, description: 'Bare lower-case host, for example robu.in.' }
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [robots, motors, electronics] }
        note: { type: string, maxLength: 300 }
      required: [name, domain, categories, note]
    PreferredVendors:
      type: object
      properties:
        vendors:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PreferredVendor' }
      required: [vendors]
    UsageBucket:
      type: object
      properties:
        calls: { type: integer }
        input: { type: integer }
        cache_write: { type: integer }
        cache_read: { type: integer }
        output: { type: integer }
        cost_usd: { type: number }
        seconds: { type: number }
        images: { type: integer }
        web_calls: { type: integer }
      required: [calls, input, cache_write, cache_read, output, cost_usd, seconds, images, web_calls]
    UsageSummary:
      type: object
      description: Model usage aggregated from the ledger.
      properties:
        period: { type: string, enum: [today, 7d, 30d, all] }
        totals:
          allOf:
            - { $ref: '#/components/schemas/UsageBucket' }
            - type: object
              properties:
                cache_hit_rate: { type: [number, 'null'] }
        by_role: { type: object, additionalProperties: { $ref: '#/components/schemas/UsageBucket' } }
        by_model: { type: object, additionalProperties: { $ref: '#/components/schemas/UsageBucket' } }
        by_robot_id: { type: object, additionalProperties: { $ref: '#/components/schemas/UsageBucket' }, description: 'By project id.' }
        by_task: { type: object, additionalProperties: { $ref: '#/components/schemas/UsageBucket' } }
        by_day: { type: object, additionalProperties: { $ref: '#/components/schemas/UsageBucket' } }
        recent: { type: array, items: { type: object, additionalProperties: true }, description: 'The latest calls.' }
      required: [period, totals, by_role, by_model, by_robot_id, by_task, by_day, recent]
